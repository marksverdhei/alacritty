[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
    "alacritty_pty_server",
    "alacritty_web",
]
default-members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
    "alacritty_pty_server",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

# Per-package overrides for the wasm crate: smaller code, no debug info.
# `strip` is left to wasm-opt — overriding it here breaks the wasm-bindgen
# name section and wasm-opt then rejects the binary. The native alacritty
# binary still gets the default thin-LTO + opt-level=3 from above.
[profile.release.package.alacritty_web]
opt-level = "z"
codegen-units = 1
debug = false

# The pty server ships inside the Android APK as a payload binary, so its
# size lands in every install. opt-level="z" + single codegen-unit +
# in-profile strip drops the per-ABI .so from ~2.7-3.0 MB to ~1.3-1.5 MB.
# (panic = "abort" would shave more but only applies workspace-wide, which
# is too invasive for the main alacritty binary.)
[profile.release.package.alacritty_pty_server]
opt-level = "z"
codegen-units = 1
strip = "symbols"
debug = false
# Note: cargo refuses `lto` in package-specific profiles — it has to be
# set workspace-wide on [profile.release] above. The existing `lto = "thin"`
# there already does most of the work; bumping to `lto = "fat"` would shave
# more but slow every other crate's release build too.

[workspace.dependencies]
toml = "0.9.11"
toml_edit = "0.24.0"
