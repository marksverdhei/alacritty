[package]
name = "alacritty_web"
version = "0.1.0"
authors = ["Alacritty Contributors"]
license = "Apache-2.0"
description = "WASM/WebGPU terminal renderer based on Alacritty"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alacritty_terminal = { path = "../alacritty_terminal", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "CanvasRenderingContext2d",
    "OffscreenCanvasRenderingContext2d",
    "TextMetrics",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "HtmlElement",
    "CssStyleDeclaration",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "DomRectReadOnly",
    "Navigator",
    "Clipboard",
    "console",
    "Performance",
    "ImageData",
] }
js-sys = "0.3"
# wgpu is gated behind the `wgpu` feature. The current build defaults to the
# Canvas 2D backend, which is faster than xterm.js for typical terminal output
# (~2× at 1MB+ payloads) and adds zero MB of wgpu shader/runtime to the wasm
# binary. Enable `--features wgpu` if you want the experimental WebGPU path.
wgpu = { version = "24", features = ["webgl"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[features]
default = []
wgpu = ["dep:wgpu", "dep:bytemuck", "web-sys/GpuCanvasContext"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
